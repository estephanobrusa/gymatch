services:
  postgres:
    image: postgres:16-alpine
    container_name: gymatch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymatch
      POSTGRES_PASSWORD: gymatch
      POSTGRES_DB: gymatch
    ports:
      # Exposed on the host at 5432 — matches DIRECT_URL in .env.local
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymatch -d gymatch"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    # Named volume for data persistence across container restarts
