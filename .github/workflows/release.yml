name: Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: "Release type"
        required: true
        default: "rc"
        type: choice
        options:
          - rc
          - stable
      version:
        description: "Explicit semver (e.g. 1.2.0 or 1.2.0-rc.2). Empty = auto next."
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version
        id: version
        run: echo "version=$(node scripts/release-version.mjs '${{ inputs.type }}' '${{ inputs.version }}')" >> "$GITHUB_OUTPUT"

      - name: Bump root package version
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "${{ steps.version.outputs.version }}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
          git push origin HEAD

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE_FLAG: ${{ inputs.type == 'rc' && '--prerelease' || '' }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "v${VERSION}^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then BODY=$(git log --oneline "$PREV..HEAD"); else BODY=$(git log --oneline -20); fi
          gh release create "v${VERSION}" --title "v${VERSION}" --notes "$BODY" $PRERELEASE_FLAG
